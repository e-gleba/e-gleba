<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>std::neptune — e-gleba channel avatar</title>
  <desc>Neptune with a C++ glyph orbit ring, wireframe ship and monospace signature. Deep space theme.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0c1233"/>
      <stop offset="55%" stop-color="#070b20"/>
      <stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <radialGradient id="neptune" cx="38%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#8fbcff"/>
      <stop offset="35%" stop-color="#4f7df2"/>
      <stop offset="72%" stop-color="#2a4cc2"/>
      <stop offset="100%" stop-color="#15246f"/>
    </radialGradient>
    <radialGradient id="terminator" cx="32%" cy="26%" r="95%">
      <stop offset="0%" stop-color="#000010" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000010" stop-opacity="0"/>
      <stop offset="100%" stop-color="#01020e" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f7cff" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#3f7cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000005" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000005" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000005" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="disk">
      <circle cx="256" cy="240" r="120"/>
    </clipPath>
    <path id="orbitPath" d="M 66 240 a 190 64 0 1 1 380 0 a 190 64 0 1 1 -380 0" fill="none"/>
  </defs>

  <!-- deep space -->
  <rect width="512" height="512" fill="url(#space)"/>

  <!-- starfield -->
  <g fill="#dfeaff">
    <circle cx="38" cy="64" r="1.4" opacity="0.9"/>
    <circle cx="72" cy="140" r="1" opacity="0.5"/>
    <circle cx="110" cy="52" r="1.8" opacity="1"/>
    <circle cx="150" cy="96" r="0.8" opacity="0.4"/>
    <circle cx="196" cy="38" r="1.2" opacity="0.7"/>
    <circle cx="250" cy="70" r="0.9" opacity="0.5"/>
    <circle cx="308" cy="44" r="1.5" opacity="0.9"/>
    <circle cx="356" cy="88" r="1" opacity="0.6"/>
    <circle cx="410" cy="50" r="1.9" opacity="1"/>
    <circle cx="462" cy="100" r="1.1" opacity="0.5"/>
    <circle cx="488" cy="160" r="0.8" opacity="0.4"/>
    <circle cx="30" cy="220" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="36" cy="380" r="1.6" opacity="0.9"/>
    <circle cx="80" cy="440" r="1" opacity="0.6"/>
    <circle cx="130" cy="470" r="1.4" opacity="0.8"/>
    <circle cx="200" cy="486" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="480" r="1.2" opacity="0.7"/>
    <circle cx="370" cy="470" r="1" opacity="0.5"/>
    <circle cx="430" cy="440" r="1.6" opacity="0.9"/>
    <circle cx="478" cy="380" r="1" opacity="0.6"/>
    <circle cx="492" cy="300" r="1.3" opacity="0.7"/>
    <circle cx="452" cy="240" r="0.8" opacity="0.4"/>
    <circle cx="160" cy="160" r="1" opacity="0.5"/>
    <circle cx="340" cy="150" r="1.1" opacity="0.6"/>
    <circle cx="420" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="96" cy="208" r="0.8" opacity="0.45"/>
    <circle cx="210" cy="120" r="1" opacity="0.5"/>
    <circle cx="300" cy="110" r="0.8" opacity="0.4"/>
    <circle cx="140" cy="360" r="1" opacity="0.5"/>
    <circle cx="380" cy="340" r="0.9" opacity="0.5"/>
    <circle cx="240" cy="420" r="0.8" opacity="0.45"/>
    <circle cx="330" cy="400" r="1" opacity="0.5"/>
  </g>
  <!-- sparkle stars -->
  <g stroke="#eaf4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <path d="M 114 84 V 96 M 108 90 H 120"/>
    <path d="M 424 114 V 126 M 418 120 H 430"/>
  </g>

  <!-- halo behind planet -->
  <circle cx="256" cy="240" r="185" fill="url(#halo)"/>

  <!-- orbit ring: faint path + C++ glyphs riding it -->
  <g transform="rotate(-18 256 240)">
    <use xlink:href="#orbitPath" href="#orbitPath" stroke="#5fb7ff" stroke-width="1" opacity="0.16"/>
    <text font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#9fd8ff" opacity="0.9" letter-spacing="4">
      <textPath xlink:href="#orbitPath" href="#orbitPath" startOffset="0" textLength="848" lengthAdjust="spacingAndGlyphs">++ :: -&gt; * &amp; { } ++ :: -&gt; * &amp; { } ++ :: -&gt; * &amp; { } ++ :: -&gt; * &amp; { }</textPath>
    </text>
  </g>

  <!-- Neptune -->
  <g clip-path="url(#disk)">
    <circle cx="256" cy="240" r="120" fill="url(#neptune)"/>
    <!-- cloud bands -->
    <ellipse cx="256" cy="196" rx="132" ry="17" fill="#a9ccff" opacity="0.16"/>
    <ellipse cx="256" cy="232" rx="138" ry="22" fill="#ffffff" opacity="0.10"/>
    <ellipse cx="256" cy="296" rx="126" ry="18" fill="#0d1b56" opacity="0.35"/>
    <ellipse cx="256" cy="330" rx="96" ry="13" fill="#0a1540" opacity="0.30"/>
    <!-- Great Dark Spot + cirrus -->
    <ellipse cx="292" cy="282" rx="24" ry="12" fill="#101f63" opacity="0.8" transform="rotate(-10 292 282)"/>
    <path d="M 268 268 q 24 -12 50 -3" stroke="#dcecff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- day/night terminator -->
    <circle cx="256" cy="240" r="120" fill="url(#terminator)"/>
  </g>
  <!-- atmosphere rim -->
  <circle cx="256" cy="240" r="122" fill="none" stroke="#8ef4ff" stroke-width="4" opacity="0.5" filter="url(#soft)"/>
  <circle cx="256" cy="240" r="120.5" fill="none" stroke="#aef7ff" stroke-width="1.6" opacity="0.85"/>

  <!-- wireframe ship on orbit (retro gamedev) -->
  <g transform="translate(432 206) rotate(-24)" stroke="#bfe6ff" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0.95">
    <path d="M 0 -11 L 8 9 L 0 4 L -8 9 Z"/>
    <circle cx="0" cy="-2" r="1.6" fill="#bfe6ff" stroke="none"/>
  </g>

  <!-- signature -->
  <text x="256" y="448" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="27" letter-spacing="6" fill="#d6ecff" opacity="0.95">e-gleba<tspan fill="#57e6ff">_</tspan></text>
  <text x="256" y="474" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" letter-spacing="3.5" fill="#7fa8d9" opacity="0.6">c++ &#183; gamedev &#183; deep space</text>

  <!-- vignette -->
  <rect width="512" height="512" fill="url(#vignette)"/>
</svg>
